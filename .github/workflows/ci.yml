name: CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Prepare container image (pull or build with buildx)
        env:
          IMAGE: ${{ secrets.IMAGE_NAME || 'sqlsmith-go/dev' }}
          PLATFORMS: ${{ env.PLATFORMS || 'linux/amd64,linux/arm64' }}
          CACHE_REGISTRY: ${{ secrets.CACHE_REGISTRY || '' }}
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || '' }}
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST || 'docker.io' }}
        run: |
          set -euo pipefail
          echo "Preparing container image: $IMAGE"
          # Try to pull a prebuilt image from registry (useful when CI pushes cache images)
          if docker pull "$IMAGE"; then
            echo "Pulled existing image: $IMAGE"
            exit 0
          fi

          export DOCKER_BUILDKIT=1
          # If registry credentials are available, buildx and push (and optionally use cache registry)
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            echo "Registry credentials found; building multi-platform image and pushing to registry"
            if [ -n "$CACHE_REGISTRY" ]; then
              docker buildx build --platform "$PLATFORMS" --tag "$IMAGE" \
                --cache-from=type=registry,ref="$CACHE_REGISTRY" \
                --cache-to=type=registry,mode=max,ref="$CACHE_REGISTRY" \
                --push -f Containerfile .
            else
              docker buildx build --platform "$PLATFORMS" --tag "$IMAGE" --push -f Containerfile .
            fi
          else
            echo "No registry credentials; building multi-platform image and loading locally"
            # The docker exporter doesn't support exporting manifest lists with --load.
            # Build only for the runner's platform when using --load.
            arch=$(uname -m || true)
            case "$arch" in
              x86_64|amd64) LOCAL_PLATFORM="linux/amd64" ;;
              aarch64|arm64) LOCAL_PLATFORM="linux/arm64" ;;
              *) LOCAL_PLATFORM="${PLATFORMS%%,*}" ;;
            esac
            echo "Building for local platform: $LOCAL_PLATFORM (requested: $PLATFORMS)"
            docker buildx build --platform "$LOCAL_PLATFORM" --tag "$IMAGE" --load -f Containerfile .
          fi

      - name: Export skip-build flag for runenv
        run: echo "SQLSMITH_GO_SKIP_BUILD=1" >> $GITHUB_ENV

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/go
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .cache/pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache node_modules for view
        uses: actions/cache@v4
        with:
          path: view/node_modules
          key: ${{ runner.os }}-vite-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Build and test
        run: |
          # ensure cache dirs exist for runenv script to mount
          mkdir -p .cache/go .cache/pnpm
          ./runenv.sh ./build.sh -t
