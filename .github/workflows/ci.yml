name: CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Prepare container image (pull or build single-arch with buildx)
        env:
          IMAGE: ${{ secrets.IMAGE_NAME || 'cyw0ng95/sqlsmith-go:dev' }}
          CACHE_REGISTRY: ${{ secrets.CACHE_REGISTRY || '' }}
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || '' }}
        run: |
          set -euo pipefail
          echo "Preparing container image base: $IMAGE"
          # compute Containerfile digest and derive tagged image name
          if command -v sha256sum >/dev/null 2>&1; then
            CF_DIGEST=$(sha256sum Containerfile | awk '{print $1}')
            CF_DIGEST=$(shasum -a 256 Containerfile | awk '{print $1}')
          fi
          CF_SHORT=${CF_DIGEST:0:12}
          IMAGE_TAGGED="${IMAGE}-cf-${CF_SHORT}"
          echo "Using tagged image: $IMAGE_TAGGED"

          # Try to pull a prebuilt image from registry (useful when CI pushes cache images)
          if docker pull "$IMAGE_TAGGED"; then
            echo "Pulled existing image: $IMAGE_TAGGED"
            # export the tagged image for later steps
            echo "DOCKER_IMAGE=$IMAGE_TAGGED" >> $GITHUB_ENV
            exit 0
          fi

          export DOCKER_BUILDKIT=1
          # Determine the runner's platform and use single-arch builds only
          arch=$(uname -m || true)
          case "$arch" in
            x86_64|amd64) LOCAL_PLATFORM="linux/amd64" ;;
            aarch64|arm64) LOCAL_PLATFORM="linux/arm64" ;;
            *) LOCAL_PLATFORM="linux/amd64" ;;
          esac

          # If registry credentials are available, buildx and push single-arch image (optionally use cache)
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            echo "Registry credentials found; building single-arch image ($LOCAL_PLATFORM) and pushing to registry"
            if [ -n "$CACHE_REGISTRY" ]; then
              docker buildx build --platform "$LOCAL_PLATFORM" --tag "$IMAGE_TAGGED" \
                --cache-from=type=registry,ref="$CACHE_REGISTRY" \
                --cache-to=type=registry,mode=max,ref="$CACHE_REGISTRY" \
                --push -f Containerfile .
            else
              docker buildx build --platform "$LOCAL_PLATFORM" --tag "$IMAGE_TAGGED" --push -f Containerfile .
            fi
            # export the tagged image for later steps
            echo "DOCKER_IMAGE=$IMAGE_TAGGED" >> $GITHUB_ENV
          else
            echo "No registry credentials; building single-arch image ($LOCAL_PLATFORM) and loading locally"
            docker buildx build --platform "$LOCAL_PLATFORM" --tag "$IMAGE_TAGGED" --load -f Containerfile .
            # export the tagged image for later steps
            echo "DOCKER_IMAGE=$IMAGE_TAGGED" >> $GITHUB_ENV
          fi

      - name: Export skip-build flag for runenv
        run: echo "SQLSMITH_GO_SKIP_BUILD=1" >> $GITHUB_ENV

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/go
            .cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .cache/pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache node_modules for view
        uses: actions/cache@v4
        with:
          path: view/node_modules
          key: ${{ runner.os }}-vite-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Build and test
        run: |
          # ensure cache dirs exist for runenv script to mount
          mkdir -p .cache/go .cache/go-build .cache/pnpm
          ./runenv.sh ./build.sh -t
